<text x="990" y="543" class="small" style="fill:#475569">3 items</text>
<rect x="400" y="563" width="640" height="60" rx="0" fill="#ffffff" stroke="#cbd5e1"/>
<text x="420" y="600" class="body">Sample notebook</text>
<rect x="400" y="623" width="640" height="60" rx="0" fill="#ffffff" stroke="#cbd5e1"/>
