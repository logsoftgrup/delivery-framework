<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery Lab — synthetic contract fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font:16px/1.5 system-ui,sans-serif}main{max-width:640px;margin:32px auto;padding:24px;background:#fff}h1{font-size:32px;line-height:1.2}p{margin:16px 0}label{display:block;font-weight:600}input,button{font:inherit;min-height:44px;border-radius:4px}input{width:100%;border:1px solid #64748b;padding:8px}button{border:1px solid #1d4ed8;background:#1d4ed8;color:white;padding:8px 20px;cursor:pointer;margin-top:16px}button:disabled{cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}li{overflow-wrap:anywhere;margin:8px 0}#help{color:#475569}#error{color:#991b1b;background:#fff1f2}#status{min-height:24px}#error:empty{display:none}@media(max-width:640px){main{margin:0;padding:24px}button{width:100%}}
</style></head><body><main><h1>Delivery Lab</h1><p>Synthetic data only. Create sample items to try the delivery journey.</p>

</main><script>window.fixtureMutation=__MUTATION__;</script><script src="/fixture.js"></script></body></html>
