<svg xmlns="http://www.w3.org/2000/svg" width="1902" height="988" viewBox="0 0 1902 988" role="img" aria-labelledby="title desc">
<title id="title">Delivery Lab proposed desktop and mobile reference</title>
<desc id="desc">Static design proposal, not a runtime screenshot. Desktop 1440 by 900 and mobile 390 by 844. Each shows a synthetic data label, title, one labelled create form, and a three-item list.</desc>
<rect width="1902" height="988" fill="#e2e8f0"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .muted{fill:#475569} .label{font-size:16px;font-weight:700} .body{font-size:16px} .small{font-size:14px} .title{font-size:32px;font-weight:700} .section{font-size:20px;font-weight:700}</style>
<text x="24" y="26" class="small">1440 × 900 · proposed desktop</text>
<g transform="translate(24 42)">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f5f7fb"/>
<rect x="400" y="70" width="153" height="28" rx="14" fill="#e0e7ff"/>
